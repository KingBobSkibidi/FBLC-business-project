{% extends "base.html" %}
{% from "_card.html" import business_card %}

{% block title %}Explore{% endblock %}

{% block content %}
    <!-- search, filter and sort -->
    <div class="center_text">
        <form method="GET">
            <input type="text" name="q" placeholder="Search businesses"
                   value="{{ search_term }}" aria-label="Search businesses">
            <br><br>
            <input type="text" name="location" placeholder="City, Province (e.g., Markham, ON)"
                   value="{{ location_filter }}" aria-label="Filter by location">
            <br><br>
            <select name="category" aria-label="Filter by category">
                <option value="">All categories</option>
                {% for cat in categories %}
                    <option value="{{ cat }}" {% if selected_category == cat %}selected{% endif %}>{{ cat }}</option>
                {% endfor %}
            </select>
            <br><br>
            <select name="sort" aria-label="Sort businesses">
                <option value="">Newest</option>
                <option value="oldest" {% if selected_sort == "oldest" %}selected{% endif %}>Oldest</option>
                <option value="rating" {% if selected_sort == "rating" %}selected{% endif %}>Rating (high to low)</option>
                <option value="rating_low" {% if selected_sort == "rating_low" %}selected{% endif %}>Rating (low to high)</option>
            </select>
            <br><br>
            <button type="submit">Apply</button>
            <a href="{{ url_for('index') }}" style="margin-left: 10px;">Clear</a>
        </form>
    </div>

    <main class="page">
        <section class="card-grid">
            {% for business in businesses %}
                {{ business_card(business, business.id in saved_business_ids) }}
            {% else %}
                <p class="center_text">No businesses</p>
            {% endfor %}
        </section>
    </main>
{% endblock %}
